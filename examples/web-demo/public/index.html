<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect-Core 数据工坊 · Web 演示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #94a3b8; font-size: 13px; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
  .panel { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; color: #7dd3fc; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 6px; }
  .btn { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer; margin: 3px 4px 3px 0; }
  .btn:hover { background: #1d4ed8; }
  .btn.green { background: #16a34a; } .btn.green:hover { background: #15803d; }
  .btn.red { background: #dc2626; } .btn.red:hover { background: #b91c1c; }
  .btn.amber { background: #d97706; } .btn.amber:hover { background: #b45309; }
  .btn.slate { background: #475569; } .btn.slate:hover { background: #334155; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  input, textarea, select { background: #0f172a; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px; padding: 6px 8px; font-size: 13px; width: 100%; margin: 4px 0; font-family: inherit; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .row label { font-size: 12px; color: #94a3b8; min-width: 70px; }
  .mod { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .mod .name { font-weight: 600; font-size: 14px; }
  .badge { font-size: 11px; border-radius: 10px; padding: 2px 8px; }
  .badge.running { background: #14532d; color: #4ade80; }
  .badge.stopped { background: #1e293b; color: #94a3b8; }
  .badge.failed { background: #450a0a; color: #f87171; }
  .arr { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .arr .an { font-weight: 600; color: #fbbf24; font-size: 13px; }
  .arr .ao { font-size: 11px; color: #94a3b8; margin-left: 8px; }
  .arr .len { font-size: 11px; color: #7dd3fc; margin-left: 8px; }
  .arr pre { max-height: 150px; overflow: auto; font-size: 11px; color: #cbd5e1; margin-top: 6px; white-space: pre-wrap; word-break: break-all; }
  .lg { font-family: Consolas, monospace; font-size: 12px; max-height: 480px; overflow-y: auto; }
  .lg .l { padding: 1px 0; color: #cbd5e1; white-space: nowrap; }
  .lg .l.error { color: #f87171; }
  .lg .l.event-drop { color: #fbbf24; }
  .lg .l.event { color: #7dd3fc; }
  .lg .l.module-start { color: #4ade80; }
  .lg .l.module-stop { color: #fca5a5; }
  .empty { color: #64748b; font-size: 12px; }
  .statusline { font-size: 12px; color: #4ade80; margin-bottom: 10px; }
  .hint { font-size: 11px; color: #64748b; margin-top: 6px; }
</style>
</head>
<body>
<h1>🔌 Connect-Core 数据工坊</h1>
<div class="sub">事件驱动的模块化框架演示：数据从 collector 出发，processor / reporter / alarm / notifier 逐级拿数、逐级唤起</div>
<div class="statusline" id="status">核心启动中...</div>

<div class="grid">
  <div>
    <!-- 数据控制 -->
    <div class="panel">
      <h2>📊 数据控制</h2>
      <div class="row">
        <button class="btn green" id="btn1">产生 1 条数据</button>
        <button class="btn green" id="btn10">批量 10 条</button>
      </div>
      <div class="row">
        <button class="btn amber" id="btnAlarm">产生超标数据（触发告警）</button>
        <button class="btn red" id="btnClear">清空数据</button>
      </div>
      <div class="hint">超标数据 value=60~100，处理器×2 后超过告警阈值 100，alarm 模块由 stats:updated 事件唤起启动</div>
    </div>

    <!-- 自定义事件 -->
    <div class="panel">
      <h2>📨 自定义事件</h2>
      <div class="row"><label>事件名</label><input id="evName" placeholder="如 my:event"></div>
      <div class="row"><label>数据 JSON</label><input id="evData" placeholder='{"msg":"hello"}（可留空）'></div>
      <button class="btn" id="btnEvent">发送事件</button>
    </div>

    <!-- 模块控制 -->
    <div class="panel">
      <h2>🧩 模块控制（停止后其数组自动消失）</h2>
      <div id="mods"></div>
    </div>

    <!-- 热加载 -->
    <div class="panel">
      <h2>🔥 热加载新模块</h2>
      <div class="row"><label>模块名</label><input id="newName" placeholder="如 auditor"></div>
      <div class="row"><label>监听事件</label><input id="newListen" placeholder="逗号分隔，如 stats:updated, alarm:fired"></div>
      <button class="btn" id="btnAdd">添加模块（写 YAML 即生效）</button>
      <div class="row" style="margin-top:10px">
        <label>移除模块</label>
        <select id="rmSel"></select>
        <button class="btn red" id="btnRm" style="min-width:80px">移除</button>
      </div>
    </div>
  </div>

  <div>
    <!-- 公共数组 -->
    <div class="panel">
      <h2>🗃️ 公共数组（实时引用 · 一次修改处处有效）</h2>
      <div id="arrays"></div>
    </div>
    <!-- 日志 -->
    <div class="panel">
      <h2>📜 事件流水日志（连续时间线 · type / source / message）</h2>
      <div class="lg" id="logs"></div>
    </div>
  </div>
</div>

<script>
var state = null;
function $(id) { return document.getElementById(id); }

async function api(path, body) {
  var opt = { method: 'POST', headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opt.body = JSON.stringify(body);
  var res = await fetch(path, opt);
  return res.json();
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderModules(mods) {
  var box = $('mods');
  if (!mods.length) { box.innerHTML = '<div class="empty">没有模块</div>'; return; }
  box.innerHTML = mods.map(function (m) {
    var badge = '<span class="badge ' + m.status + '">' + m.status + '</span>';
    var btn = m.status === 'running'
      ? '<button class="btn red" data-stop="' + esc(m.name) + '">停止</button>'
      : '<button class="btn green" data-start="' + esc(m.name) + '">启动</button>';
    var err = m.error ? '<div class="hint">' + esc(m.error) + '</div>' : '';
    var se = (m.config.startEvents || []).join(', ');
    var li = (m.config.listen || []).join(', ');
    return '<div class="mod"><div><div class="name">' + esc(m.name) + ' ' + badge + '</div>' +
      '<div class="hint">启动: ' + esc(se || '（事件驱动）') + ' · 监听: ' + esc(li || '—') + '</div>' + err + '</div>' + btn + '</div>';
  }).join('');
  box.querySelectorAll('button[data-stop]').forEach(function (b) {
    b.onclick = function () { api('/api/module/stop', { name: b.dataset.stop }); };
  });
  box.querySelectorAll('button[data-start]').forEach(function (b) {
    b.onclick = function () { api('/api/module/start', { name: b.dataset.start }); };
  });
  // 同步移除下拉
  var sel = $('rmSel');
  var cur = sel.value;
  sel.innerHTML = mods.map(function (m) { return '<option value="' + esc(m.name) + '">' + esc(m.name) + '</option>'; }).join('');
  if (mods.some(function (m) { return m.name === cur; })) sel.value = cur;
}

function renderArrays(arrays) {
  var box = $('arrays');
  if (!arrays.length) { box.innerHTML = '<div class="empty">暂无公共数组（模块停止后其数组会消失）</div>'; return; }
  box.innerHTML = arrays.map(function (a) {
    return '<div class="arr"><span class="an">' + esc(a.name) + '</span>' +
      '<span class="ao">owner: ' + esc(a.owner) + '</span>' +
      '<span class="len">长度 ' + a.items.length + '</span>' +
      '<pre>' + esc(JSON.stringify(a.items, null, 1)) + '</pre></div>';
  }).join('');
}

function renderLogs(logs) {
  var box = $('logs');
  var scrollAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  // 连续时间线：发生什么就记录什么，按时间顺序逐条显示；颜色只做快速扫描辅助
  box.innerHTML = logs.map(function (l) {
    var cls = 'l ' + l.category;
    if (l.category === 'error') cls = 'l error';
    else if (l.category === 'event') cls = 'l event';
    else if (l.type === 'module-start') cls = 'l module-start';
    else if (l.type === 'module-stop') cls = 'l module-stop';
    return '<div class="' + cls + '">' + esc(l.line) + '</div>';
  }).join('');
  if (scrollAtBottom) box.scrollTop = box.scrollHeight;
}

async function refresh() {
  try {
    var res = await fetch('/api/state');
    state = await res.json();
    $('status').textContent = state.started
      ? '✅ 核心运行中 · 模块 ' + state.modules.filter(function (m) { return m.status === 'running'; }).length + '/' + state.modules.length + ' · 日志 ' + state.logCount + ' 条'
      : '⛔ 核心未运行';
    renderModules(state.modules);
    renderArrays(state.arrays);
    renderLogs(state.logs);
  } catch (e) { /* 服务器未就绪 */ }
}

$('btn1').onclick = function () { api('/api/produce', { count: 1, max: 50 }); };
$('btn10').onclick = function () { api('/api/produce', { count: 10, max: 50 }); };
$('btnAlarm').onclick = function () { api('/api/produce', { count: 1, max: 100 }); };
$('btnClear').onclick = function () { api('/api/clear'); };
$('btnEvent').onclick = function () {
  var data = null;
  if ($('evData').value.trim()) {
    try { data = JSON.parse($('evData').value); }
    catch (e) { alert('数据 JSON 格式错误'); return; }
  }
  api('/api/event', { name: $('evName').value, data: data });
};
$('btnAdd').onclick = function () {
  api('/api/module/add', { name: $('newName').value, listen: $('newListen').value }).then(function (r) {
    if (r.error) alert(r.error); else { $('newName').value = ''; $('newListen').value = ''; }
  });
};
$('btnRm').onclick = function () {
  var name = $('rmSel').value;
  if (name) api('/api/module/remove', { name: name });
};

refresh();
setInterval(refresh, 1200);
</script>
</body>
</html>
