<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>__TITLE__</title>
<style>
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  h1 { font-size: 20px; }
  .sub { color: #94a3b8; font-size: 13px; margin: 6px 0 16px; }
  .panel { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .panel h2 { font-size: 14px; color: #7dd3fc; margin-bottom: 8px; border-bottom: 1px solid #334155; padding-bottom: 6px; }
  .arr { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .an { font-weight: 600; color: #fbbf24; font-size: 13px; }
  .ao { font-size: 11px; color: #94a3b8; margin-left: 8px; }
  .len { font-size: 11px; color: #7dd3fc; margin-left: 8px; }
  pre { max-height: 130px; overflow: auto; font-size: 11px; color: #cbd5e1; margin: 6px 0 0; white-space: pre-wrap; }
  .lg { font-family: Consolas, monospace; font-size: 12px; max-height: 380px; overflow-y: auto; }
  .lg div { padding: 1px 0; color: #cbd5e1; white-space: nowrap; }
  .btn { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 7px 12px; cursor: pointer; margin: 3px 6px 3px 0; }
  .btn:hover { background: #1d4ed8; }
  input { background: #0f172a; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px; padding: 6px 8px; font-size: 13px; margin: 4px 6px 4px 0; }
  .empty { color: #64748b; font-size: 12px; }
  .mod { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
</style>
</head>
<body>
<h1>🌐 __TITLE__（端口 __PORT__）</h1>
<div class="sub">Connect-Core 分布式胶水层演示：bridge 模块把事件转发到对端、把对端数组镜像到本地</div>
<div class="panel">
  <h2>📨 操作</h2>
  <input id="oid" placeholder="订单号（默认自动）">
  <input id="ogoods" placeholder="商品（默认：剑）">
  <button class="btn" id="send">发出新订单（order:new）</button>
  <div class="mod" id="mods"></div>
</div>
<div class="panel"><h2>🗃️ 本站点数组</h2><div id="arrays"></div></div>
<div class="panel"><h2>📜 本站点事件流水</h2><div class="lg" id="logs"></div></div>

<script>
var seq = 0;
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
async function refresh() {
  var r = await fetch('/api/state');
  var s = await r.json();
  $('mods').textContent = '模块: ' + s.modules.map(function (m) { return m.name + '(' + m.status + ')'; }).join(' · ');
  var box = $('arrays');
  if (!s.arrays.length) { box.innerHTML = '<div class="empty">暂无数组</div>'; return; }
  box.innerHTML = s.arrays.map(function (a) {
    return '<div class="arr"><span class="an">' + esc(a.name) + '</span><span class="ao">owner: ' + esc(a.owner) + '</span><span class="len">长度 ' + a.items.length + '</span><pre>' + esc(JSON.stringify(a.items, null, 1)) + '</pre></div>';
  }).join('');
  var lg = $('logs');
  var atBottom = lg.scrollHeight - lg.scrollTop - lg.clientHeight < 40;
  lg.innerHTML = s.logs.map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('');
  if (atBottom) lg.scrollTop = lg.scrollHeight;
}
$('send').onclick = function () {
  seq++;
  var id = $('oid').value || ('order-' + Date.now() + '-' + seq);
  var goods = $('ogoods').value || '剑';
  fetch('/api/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'order:new', data: { id: id, goods: goods } }) });
};
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
